; 12V pump test stand on CH32V003F4P6 (TSSOP-20).
; Pins and rationale - see ../ch32v003-pin-check/README.md.

[env:ch32v003f4p6_evt_r0]
platform = ch32v
framework = noneos-sdk
board = ch32v003f4p6_evt_r0

; Currently using Arduino Uno + Ardulink (see README), but pio does not
; pass "-C ardulink -c <port>" here automatically, so it is more reliable
; to call minichlink manually (command in README) than `pio run -t upload`.
upload_protocol = minichlink
; upload_protocol = wch-link      ; if you connect a WCH-LinkE

monitor_speed = 115200
