; Minimal firmware to check specific CH32V003F4P6 (TSSOP-20) pins
; before building the whole stand on it. Does NOT touch PD1 (pin 18, SWIO)
; or PD7 (pin 4, NRST) - see README.md.
;
; platform=ch32v / framework=noneos-sdk - unofficial platform
; Community-PIO-CH32V (https://github.com/Community-PIO-CH32V/platform-ch32v),
; same approach as ogr-node-hal-ch32v003.

[env:ch32v003f4p6_evt_r0]
platform = ch32v
framework = noneos-sdk
board = ch32v003f4p6_evt_r0

; Both options are available - pick the one currently connected:
upload_protocol = wch-link
; upload_protocol = minichlink   ; Arduino+Ardulink (see the ogr-node-hal-ch32v003 README)

monitor_speed = 115200
