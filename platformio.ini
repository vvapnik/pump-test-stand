; Two environments for the same code:
;   atmega328_internal_rc   - breadboard WITHOUT a crystal (for now, to check the circuit)
;   atmega328_external_xtal - production build with an external 16 MHz crystal
;
; Switching environments does not change the fuses (clock source) during a
; normal upload - write them explicitly once via ISP:
;   pio run -e <env> -t fuses    (writes fuses, ONCE per environment switch)
;   pio run -e <env> -t upload   (uploads the program itself)

[env]
platform = atmelavr
board = ATmega328P
framework = arduino
upload_protocol = usbasp
lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
; Serial is deliberately slow (9600): the internal RC oscillator's factory
; calibration is off by a few %, which can garble the serial monitor at high
; UART speeds. 9600 is reliable in both environments, and speed does not
; matter for logs every 200 ms.
monitor_speed = 9600

[env:atmega328_internal_rc]
; No crystal - internal 8 MHz RC oscillator. Handy for a first check of the
; breadboard circuit; then move to atmega328_external_xtal.
board_build.f_cpu = 8000000L
board_hardware.oscillator = internal

[env:atmega328_external_xtal]
; Production build - external 16 MHz crystal + 2x22 pF to GND.
; If you flash via the Optiboot bootloader over UART/FTDI instead of ISP,
; change upload_protocol/upload_speed to arduino/57600.
board_build.f_cpu = 16000000L
board_hardware.oscillator = external
